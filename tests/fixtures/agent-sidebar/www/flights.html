<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyFare – Search flights</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231a73e8'/%3E%3Cpath d='M3 9l10-4-3 7-2-2-3 1z' fill='white'/%3E%3C/svg%3E">
<style>
  body { margin: 0; font: 15px/1.5 -apple-system, sans-serif; color: #1d1d1f; background: #f4f6fb; }
  .top { background: #1a73e8; color: #fff; padding: 16px 28px; font-weight: 700; font-size: 18px; }
  form { display: flex; gap: 10px; padding: 22px 28px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label { display: flex; flex-direction: column; font-size: 12px; color: #55555a; gap: 4px; }
  input { font: inherit; padding: 8px 10px; border: 1px solid #d6d9e0; border-radius: 8px; width: 150px; }
  button { align-self: flex-end; font: 600 15px -apple-system, sans-serif; background: #1a73e8; color: #fff; border: none; border-radius: 8px; padding: 9px 18px; }
  .results { padding: 18px 28px; display: grid; gap: 10px; }
  .r { background: #fff; border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .r b { font-size: 16px; } .p { color: #0a7a3d; font-weight: 700; }
</style>
</head>
<body>
<div class="top">SkyFare</div>
<form onsubmit="event.preventDefault(); document.getElementById('res').hidden = false;">
  <label>From <input id="from" name="from" placeholder="City or airport"></label>
  <label>To <input id="to" name="to" placeholder="City or airport"></label>
  <label>Depart <input id="date" name="date" value="Dec 12"></label>
  <button id="search" type="submit">Search</button>
</form>
<div class="results" id="res" hidden>
  <div class="r"><div><b>SFO → HND</b><div>ANA · nonstop · 11 h 25 min</div></div><div class="p">$842</div></div>
  <div class="r"><div><b>SFO → NRT</b><div>United · nonstop · 11 h 10 min</div></div><div class="p">$871</div></div>
  <div class="r"><div><b>SFO → HND</b><div>JAL · nonstop · 11 h 40 min</div></div><div class="p">$889</div></div>
</div>
</body>
</html>
