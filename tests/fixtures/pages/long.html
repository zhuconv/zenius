<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zoo: long page</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; }
  #sticky { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #ccc; padding: 8px 16px; }
  #fixed-footer { position: fixed; bottom: 0; left: 0; right: 0; background: #eee; padding: 6px 16px; }
  main { padding: 8px 16px 64px; }
  #inner { height: 120px; width: 360px; overflow: auto; border: 1px solid #888; }
  #wide { width: 360px; overflow-x: auto; white-space: nowrap; border: 1px solid #888; }
</style>
</head>
<body>
<div id="sticky"><a href="#top">Top</a> · <button>Sticky action</button></div>
<main>
  <h1 id="top">Long page</h1>
  <div id="inner" aria-label="Inner scroller">
    <p>Inner item 1</p><p>Inner item 2</p><p>Inner item 3</p><p>Inner item 4</p><p>Inner item 5</p><p>Inner item 6</p><button>Inner bottom button</button>
  </div>
  <div id="wide">
    <span>Wide cell A</span> <span style="display:inline-block;width:600px"></span> <button>Far right button</button>
  </div>
  <ol id="items"></ol>
  <h2>Below the fold</h2>
  <p>Final paragraph far below.</p>
  <button id="last">Last button</button>
</main>
<div id="fixed-footer">Fixed footer <a href="/secondary">Footer link</a></div>
<script>
  const ol = document.getElementById("items");
  for (let i = 1; i <= 150; i++) {
    const li = document.createElement("li");
    li.innerHTML = i % 10 === 0 ? `<a href="/nav-target?i=${i}">Item ${i} link</a>` : `Item ${i}`;
    ol.appendChild(li);
  }
</script>
</body>
</html>
