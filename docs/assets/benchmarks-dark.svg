<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 566" width="880" height="566" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">Median time of each operation: zen(ius) against Ego Lite</title>
<desc id="d">A dot plot on a log scale of the median time of 13 operations an agent uses, for Ego Lite 0.6.3.17 and zen(ius) 0.1.0 (a pre-release build, 2026-11-21). zen(ius) was faster on all 27 operations both runs timed. Start a script, first call: Ego Lite 166 ms, zen(ius) 44 ms, 3.8× faster. New task space: Ego Lite 246 ms, zen(ius) 47 ms, 5.2× faster. Open a local page: Ego Lite 258 ms, zen(ius) 6.6 ms, 39× faster. Open example.com (network): Ego Lite 527 ms, zen(ius) 239 ms, 2.2× faster. Snapshot, typical page: Ego Lite 103 ms, zen(ius) 7.9 ms, 13× faster. Snapshot, huge page: Ego Lite 9.3 s, zen(ius) 79 ms, 117× faster. Click: Ego Lite 1.0 s, zen(ius) 27 ms, 38× faster. Fill a field: Ego Lite 21 ms, zen(ius) 0.6 ms, 36× faster. Type 50 characters: Ego Lite 68 ms, zen(ius) 6.5 ms, 10× faster. Evaluate JavaScript: Ego Lite 5.2 ms, zen(ius) 0.21 ms, 25× faster. Screenshot, viewport: Ego Lite 84 ms, zen(ius) 10 ms, 8.1× faster. Wait for an element (200 ms): Ego Lite 216 ms, zen(ius) 202 ms, 1.1× faster. Finish a task: Ego Lite 54 ms, zen(ius) 16 ms, 3.5× faster.</desc>
<rect width="880" height="566" fill="#0d1117"/>
<text x="24" y="38" font-size="17" font-weight="600" fill="#f0f6fc">Median time of each operation (log scale)</text>
<text x="24" y="61" font-size="13" fill="#9198a1">Ego Lite 0.6.3.17 and zen(ius) 0.1.0 (a pre-release build, 2026-11-21), the same bench on the same Mac. Lower is faster.</text>
